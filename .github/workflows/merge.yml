name: Manual merge Develop to Main

on:
  workflow_dispatch:
    inputs:
      confirm_merge:
        description: "Type 'yes' to confirm merging develop into main"
        required: true
        default: "no"
      release_type:
        description: "Version bump: patch, minor, major"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  lint-and-merge:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Syntax Check (Lint)
        run: npm run lint

      - name: Check Formatting (Prettier)
        run: npx prettier --check "src/**/*.ts"

      - name: Version Bump and Merge
        if: |
          github.event.inputs.confirm_merge == 'yes' && 
          github.actor == 'Iulian2023'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          # 1. Get latest changes
          git fetch origin main
          git fetch origin develop

          # 2. Switch to main
          git checkout main
          git pull origin main

          # 3. Merge develop into main locally
          git merge origin/develop --no-ff -m "Manual merge from develop"

          # 4. Bump version only on main to bypass develop's PR rules
          npm version ${{ github.event.inputs.release_type }} -m "chore(release): %s"

          # 5. Push directly to main
          git push origin main --follow-tags
